spring.application.name=ses

# Loads the one deployment-local properties file. It is gitignored and carries
# the target database credentials and settings for this WAR. Keep the profile
# fixed at local; do not select a different profile through a global WebLogic
# spring.profiles.active argument.
spring.profiles.active=local

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8082}

# ─── DataSource ───────────────────────────────────────────────────────────────
# Points at the PLATFORM schema (app_* tables created by platform/sql/01_ddl.sql
# and seeded by 02_seed_data.sql).
#
# NO CREDENTIALS IN THIS FILE - it is committed. The real values live in
# the selected profile file, which is gitignored. Copy the matching .example
# file to create it; see README.
#
# That file sits in src/main/resources, so Maven packages it into
# WEB-INF/classes/ - which is how the deployed WAR carries its credentials.
# Before deploying, confirm which database the artifact points at:
#   unzip -p target/ses-app.war WEB-INF/classes/application-local.properties
#
# Any of these can still be overridden by a real environment variable. The
# password default is deliberately empty: a fake default fails with a
# confusing ORA-01017 instead of an obvious "no password configured".
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:10.10.214.48}:${DB_PORT:1521}/${DB_SERVICE:${DB_SID:ELLDEV}}
spring.datasource.username=${DB_USERNAME:ses}
spring.datasource.password=${DB_PASSWORD:ses2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.data-source-properties.defaultRowPrefetch=50

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
# ddl-auto=none everywhere — schema changes always need a manual SQL script
# against the platform schema; Hibernate will not create/alter tables.
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# ─── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.devtools.add-properties=false
spring.devtools.livereload.enabled=false

# cache=true above is required in anything that is not a template-editing
# session. With it false, base + sidebar + navbar + footer + the page template
# are re-parsed on EVERY request. Measured on this schema: /sticker renders in
# ~420 ms while issuing only 5 queries (~25 ms of DB at this RTT), and /history
# in ~1250 ms on 10 queries -- the gap is template parsing, paid on every page.
# Override to false in application-local.properties while editing templates;
# never ship it false.

# --- Static resources: caching + content-hash versioning ---------------------
# Before this block the app sent no Cache-Control at all on /css, /js, /vendor,
# /image (and `no-store` whenever devtools was active), so every navigation
# re-downloaded ~2.8 MB of unchanged assets. That, not the DB, is the bulk of
# the "every page takes 5 seconds" report.
#
# max-age is safe this high ONLY because of the content chain below: it rewrites
# every th:href/th:src="@{...}" link to carry a hash of the file's bytes, so
# changing a file changes its URL and no client can serve a stale copy. Spring
# Boot registers ResourceUrlEncodingFilter automatically when the chain is
# enabled, which is what makes Thymeleaf's @{...} emit the hashed form.
# Do not set max-age without the chain.
spring.web.resources.cache.cachecontrol.max-age=365d
# 365d cache for static resources
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.chain.compressed=true
spring.web.resources.chain.cache=true

# --- Response compression ----------------------------------------------------
# WARNING: server.* configures the EMBEDDED container only. On WebLogic 12c this
# whole block is ignored -- GZIP has to be switched on per Managed Server
# (Console -> Server -> Protocols -> HTTP -> Enable GZIP Compression); see
# docs/build-production.md. Keep both: this covers `java -jar` and local runs.
# Measured ratio on this asset set: 2 757 328 B -> 732 293 B (26.6%).
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/xml,image/svg+xml

# ─── Uploads (AppFileService, com.badaklng.ses.file) ───────────────────────────
# One-big-multipart-POST-on-save convention (see request module). No total-size
# cap: per-file is the only ceiling that matters now, so request/response size
# limits are left unbounded (-1) rather than guessed at.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
ses.upload.max-document-size=20MB
ses.upload.allowed-types=application/pdf,image/jpeg,image/png

# ─── Quartz ───────────────────────────────────────────────────────────────────
spring.quartz.job-store-type=memory
# Schedules are manually started from the Scheduler Monitor by default.
# Set to true in the environment that should auto-start APP_CAT schedules.
app.scheduler.auto-start=false

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
# Platform brings spring-ldap-core onto the classpath, so Actuator auto-registers
# an LDAP health indicator that probes the (LOCAL-auth, no LDAP configured) server
# and WARNs on every health hit. SES is LOCAL-auth only — drop the indicator.
management.health.ldap.enabled=false

# ─── LDAP (active, selaras dengan KPI) ────────────────────────────────────────
# Real prod values, ported from legacy carsis/crw ldap0.properties/ldap1.properties
# (see ../portal-hybrid-v3/kpi_ldap.py for the reference implementation).
# Points LdapTemplate at the real server. SesUserProvisioningProvider tries
# LDAP bind + auto-provisioning first; CustomAuthenticationProvider (platform)
# is the LOCAL-auth fallback for app_user rows with auth_type=LOCAL.
#
app.ldap.enabled=true
spring.ldap.urls=ldap://rldapbtg.badaklng.com:389,ldap://rldapbtg.badaklng.home:389
spring.ldap.base=
app.ldap.user-dn-pattern=cn={0},o=users
#
# Legacy client also tries a second base as fallback: cn={0},o=jkt (server 2) —
# SesUserProvisioningProvider tries user-dn-pattern first, then this one.
app.ldap.secondary-user-dn-pattern=cn={0},o=jkt
#
# Legacy directory has LDAPUserGroupEnable=No (bind-only, no group SEARCH) —
# matches this service's direct-bind design, no change needed there.
# identity-attribute activates attribute-based mode: the LDAP badgeNumber
# attribute (not the typed login) becomes app_user.username.
app.ldap.identity-attribute=badgeNumber
app.ldap.name-attributes=displayName,cn
app.ldap.email-attribute=mail
# JIT-provision app_user on first successful LDAP bind, default role
# REQUESTOR (seeded in sql/19_requestor_role_seed.sql).
app.ldap.auto-provision=true
app.ldap.default-role=REQUESTOR
app.ldap.connect-timeout-ms=5000
app.ldap.read-timeout-ms=5000

# ─── Approval email notifications (ApprovalMailService) ───────────────────────
# Queues mail via the platform's AppMailService/MailJob (APP_MAIL table,
# drained every minute) — see sql/README.md and ApprovalMailService's javadoc.
# The dev/test redirect safety valve is NOT a property any more — it moved to
# the TESTING_MODE / REDIRECT_MAIL / ADMIN_EMAIL rows in APP_PARAMETER, applied
# at send time by SesMailJob so it covers every outbound mail rather than just
# this module's. Edit it live at /admin/parameter; see
# sql/37_mail_parameter_seed.sql. Restart the application after changing these
# cached APP_PARAMETER values.
ses.mail.approval.enabled=true
# Fallback base URL for links inside approval mail. The APP_LINK AppParameter
# wins when set — this only applies if that row is missing or blank.
ses.app.base-url=http://localhost:${server.port}

# TTL for the in-memory "my pending approvals" cache shared by the navbar
# badge (ApprovalGlobalModelAttributes) and /approval (ApprovalController) —
# both used to run their own live APP_APPROVAL_VIEW query on every page
# load. Explicitly invalidated after a user's own approve/reject and for
# newly-assigned approvers (ApprovalService), so this TTL only bounds
# staleness for approvers who didn't just act.
ses.approval.inbox-cache-ttl-ms=30000

# TTL for the in-memory /dashboard admin snapshot (DashboardService.snapshot())
# and the verified-payments cash-inflow read (PaymentService.findVerified()) —
# both are full-table reads that every admin/officer /dashboard hit repeats,
# the latter twice per hit (summary + cash chart). Explicitly invalidated on
# approve()/submitAndVerifyOnBehalf(), so this TTL only bounds staleness from
# someone else's concurrent approval.
ses.dashboard.snapshot-cache-ttl-ms=60000
ses.payment.verified-cache-ttl-ms=60000

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.badaklng=INFO
