<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="'Login | ' + ${appName}">Login</title>
    <link rel="icon" type="image/png" th:href="@{/image/ptb_logo.png}" />
    <link rel="shortcut icon" th:href="@{/favicon.ico}" />
    <link rel="preload" as="image" th:href="@{/image/ptb_logo.png}" fetchpriority="high" type="image/png" />
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <style>
        body {
            background: radial-gradient(circle at 50% 35%, #002244 0%, #001224 60%, #000814 100%);
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }


        .login-container-wrap {
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .login-wrapper {
            position: relative;
            max-width: 420px;
            margin: 0 auto;
        }

        .login-card {
            border-radius: 1.25rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 20px 50px rgba(0, 10, 30, 0.55), 0 0 35px rgba(0, 240, 255, 0.12);
            width: 100%;
            margin: 0 auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 25px 60px rgba(0, 10, 30, 0.65), 0 0 45px rgba(0, 240, 255, 0.22);
        }

        .login-brand {
            font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #003f7d !important;
        }

        .login-card .btn-primary {
            background: linear-gradient(135deg, #004b99 0%, #002d5a 100%);
            border-color: #003f7d;
            box-shadow: 0 4px 15px rgba(0, 75, 153, 0.35);
            transition: all 0.25s ease;
        }

        .login-card .btn-primary:hover,
        .login-card .btn-primary:focus {
            background: linear-gradient(135deg, #005bb8 0%, #003870 100%);
            border-color: #00264d;
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.35);
            transform: translateY(-1px);
        }

        .login-badge-subtitle {
            font-size: 0.8rem;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .password-toggle-btn {
            background-color: #ffffff;
            border-color: #dee2e6;
            color: #64748b;
            transition: color 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
        }

        .password-toggle-btn:hover,
        .password-toggle-btn:focus {
            background-color: #f8fafc;
            color: #0f172a;
            border-color: #dee2e6;
            box-shadow: none !important;
        }

        .input-group:focus-within .form-control,
        .input-group:focus-within .input-group-text,
        .input-group:focus-within .password-toggle-btn {
            border-color: #86b7fe;
        }

    </style>
</head>

<body class="d-flex align-items-center justify-content-center py-4">


    <div class="container login-container-wrap">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <div class="login-wrapper">

                    <div class="card login-card animate__animated animate__fadeInDown">
                        <div class="card-body p-4 p-sm-5">

                            <!-- Brand -->
                            <div class="text-center mb-4">
                                <img th:src="@{/image/ptb_logo.png}" alt="PT Badak NGL" width="89" height="75" loading="eager" fetchpriority="high" style="max-height: 75px; width: auto;" class="mb-2" />
                                <div class="login-brand" th:text="${appName}">Security Suite</div>
                                <div class="login-badge-subtitle">Sistem Pengamanan Terpadu Kilang PT Badak NGL</div>
                            </div>

                            <!-- Error Alert -->
                            <div th:if="${param.error}" class="alert alert-danger py-2 small mb-3">
                                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                                Username atau password tidak valid.
                            </div>
                            <div th:if="${param.logout}" class="alert alert-success py-2 small mb-3">
                                <i class="bi bi-check-circle-fill me-1"></i>
                                Anda telah berhasil logout.
                            </div>
                            <div th:if="${param.expired}" class="alert alert-warning py-2 small mb-3">
                                <i class="bi bi-clock-history me-1"></i>
                                Sesi berakhir. Silakan login kembali.
                            </div>

                            <!-- Login form -->
                            <form th:action="@{/login}" method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                                        <input type="text" class="form-control border-start-0 ps-1" name="username" autocomplete="username"
                                            placeholder="Masukkan username atau badge" required autofocus />
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small fw-semibold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
                                        <input type="password" id="passwordInput" class="form-control border-start-0 border-end-0 ps-1" name="password"
                                            autocomplete="current-password" placeholder="Masukkan password" required />
                                        <button class="btn btn-outline-secondary border-start-0 password-toggle-btn d-flex align-items-center justify-content-center px-3"
                                            type="button" id="togglePasswordBtn" tabindex="-1" title="Lihat password" aria-label="Lihat password">
                                            <i data-lucide="eye" id="toggleEyeIcon" style="width: 18px; height: 18px;"></i>
                                        </button>
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-pill w-100 fw-bold mt-2 py-2">
                                    <i class="bi bi-box-arrow-in-right me-2"></i>Login
                                </button>
                            </form>

                            <div class="text-center text-muted small mt-4 pt-3 border-top" style="font-size: 0.78rem;">
                                &copy; <span th:text="${#calendars.year(#calendars.createNow())}">2026</span>
                                <span th:text="${appParams != null and appParams['SES_TXT_BRAND_APP_NAME'] != null
                                                 ? appParams['SES_TXT_BRAND_APP_NAME'] : 'Security Suite'}">Security Suite</span>
                                &bull;
                                <span th:text="${appParams != null and appParams['SES_TXT_BRAND_COMPANY_SHORT'] != null
                                                 ? appParams['SES_TXT_BRAND_COMPANY_SHORT'] : 'PT BADAK NGL'}">PT BADAK NGL</span>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Render Lucide icons
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }

            // Password visibility toggle
            var passwordInput = document.getElementById('passwordInput');
            var togglePasswordBtn = document.getElementById('togglePasswordBtn');

            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', function (e) {
                    e.preventDefault();
                    var isPassword = passwordInput.getAttribute('type') === 'password';
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                    togglePasswordBtn.setAttribute('title', isPassword ? 'Sembunyikan password' : 'Lihat password');
                    togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Sembunyikan password' : 'Lihat password');

                    // Swap icon between eye and eye-off
                    var nextIcon = isPassword ? 'eye-off' : 'eye';
                    togglePasswordBtn.innerHTML = '<i data-lucide="' + nextIcon + '" id="toggleEyeIcon" style="width: 18px; height: 18px;"></i>';
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons();
                    }
                    passwordInput.focus();
                });
            }

        });
    </script>
</body>

</html>
