<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="text-muted">
            Mapping for: <strong th:text="${form.formCode}">SES_REQUEST</strong>
        </span>
        <a th:href="@{/approval/map}" class="btn btn-outline-secondary btn-sm inline-flex items-center gap-1.5">
            <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i><span>Back to list</span>
        </a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-light"><strong>Form</strong></div>
        <div class="card-body row g-3">
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Form Code</label>
                <input type="text" class="form-control form-control-sm bg-light font-monospace" readonly disabled
                       th:value="${form.formCode}"/>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Form Name</label>
                <input type="text" class="form-control form-control-sm bg-light" readonly disabled
                       th:value="${form.formName}"/>
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-semibold">Match Key Label</label>
                <input type="text" class="form-control form-control-sm bg-light" readonly disabled
                       th:value="${form.matchKeyLabel}"/>
            </div>
            <div class="col-12">
                <small class="text-muted flex items-center gap-1.5">
                    <i data-lucide="info" class="h-3.5 w-3.5 text-blue-500 shrink-0"></i>
                    <span>These fields are synced from the form module's own descriptor bean at every startup and
                    are not editable here — code always wins on the next boot.</span>
                </small>
            </div>
        </div>
    </div>

    <form th:action="@{/approval/map/save}" method="post" th:object="${form}" id="mapForm">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <input type="hidden" th:field="*{formCode}"/>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-light"><strong>Default Chain</strong></div>
            <div class="card-body">
                <select class="form-select select2-step" th:field="*{defaultChainId}">
                    <option value="">— none —</option>
                    <option th:each="c : ${chains}" th:value="${c.chainId}" th:text="${c.chainName}">Chain</option>
                </select>
                <div class="form-text">Used when no override below matches the request's routing value.</div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="mb-0">Overrides</h6>
            <button type="button" class="btn btn-outline-primary btn-sm inline-flex items-center gap-1.5" data-add="overrides" data-tpl="tpl-override">
                <i data-lucide="plus" class="h-3.5 w-3.5"></i><span>Add Override</span>
            </button>
        </div>

        <div data-repeat="overrides" data-repeat-list="overrides" class="mb-3">
            <div th:each="o, oIter : *{overrides}" data-repeat-row class="row g-3 align-items-stretch mb-2"
                 th:with="matchKeyCodes=${matchKeyOptions.![code]}, isKnown=${matchKeyOptions.isEmpty() or o.matchKey == null or #strings.isEmpty(o.matchKey) or matchKeyCodes.contains(o.matchKey)}">
                <input type="hidden" th:field="*{overrides[__${oIter.index}__].mapId}"/>

                <div class="col" th:if="${!matchKeyOptions.isEmpty()}">
                  <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center text-center">
                    <label class="form-label small fw-semibold">Match Key</label>
                    <div class="js-matchkey-select-wrap w-100" th:classappend="${isKnown} ? '' : 'd-none'">
                        <select class="form-select form-select-sm js-matchkey-select"
                                th:name="|overrides[${oIter.index}].matchKey|"
                                th:disabled="${!isKnown}">
                            <option value="">— select —</option>
                            <option th:each="opt : ${matchKeyOptions}" th:value="${opt.code}"
                                    th:text="${opt.label + ' (' + opt.code + ')'}"
                                    th:selected="${opt.code == o.matchKey}">Label (CODE)</option>
                            <option value="__CUSTOM__">— custom… —</option>
                        </select>
                    </div>
                    <div class="js-matchkey-text-wrap d-flex align-items-center justify-content-center gap-1 w-100" th:classappend="${isKnown} ? 'd-none' : ''">
                        <input type="text" class="form-control form-control-sm js-matchkey-text"
                               th:name="|overrides[${oIter.index}].matchKey|"
                               th:value="${o.matchKey}"
                               th:disabled="${isKnown}"
                               placeholder="custom key" maxlength="50"/>
                        <i th:if="${!isKnown}" data-lucide="alert-triangle" class="h-4 w-4 text-amber-500 inline-block shrink-0"
                           title="This key is no longer in the option list — kept as free text so it is never silently dropped."></i>
                        <button type="button" class="btn btn-sm btn-outline-secondary js-matchkey-switch" title="Use dropdown instead">
                            <i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i>
                        </button>
                    </div>
                  </div>
                </div>
                <div class="col" th:if="${matchKeyOptions.isEmpty()}">
                  <div class="border rounded-2 p-2 h-100 text-center">
                    <label class="form-label small fw-semibold">Match Key</label>
                    <input type="text" class="form-control form-control-sm js-matchkey-text"
                           th:name="|overrides[${oIter.index}].matchKey|"
                           th:value="${o.matchKey}"
                           placeholder="match key" maxlength="50" required/>
                  </div>
                </div>

                <div class="col">
                  <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center text-center">
                    <label class="form-label small fw-semibold">Chain</label>
                    <select class="form-select form-select-sm select2-step w-100"
                            th:field="*{overrides[__${oIter.index}__].chainId}">
                        <option value="">— choose chain —</option>
                        <option th:each="c : ${chains}" th:value="${c.chainId}" th:text="${c.chainName}">Chain</option>
                    </select>
                  </div>
                </div>

                <div class="col-auto flex-shrink-0">
                  <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center justify-content-center text-center">
                    <label class="form-label small fw-semibold d-block">Active</label>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" value="Y"
                               th:field="*{overrides[__${oIter.index}__].activeFlag}"/>
                    </div>
                  </div>
                </div>

                <div class="col-auto flex-shrink-0">
                  <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center justify-content-center text-center">
                    <label class="form-label small fw-semibold mb-1">&nbsp;</label>
                    <button type="button" class="btn btn-sm btn-outline-danger" data-remove title="Remove override">
                        <i data-lucide="x" class="h-3.5 w-3.5"></i>
                    </button>
                  </div>
                </div>
            </div>
        </div>

        <div th:if="${pageActions['/approval/map/form'] != null and pageActions['/approval/map/form'].contains('SUBMIT')}"
             class="d-flex gap-2">
            <button type="submit" class="btn btn-primary inline-flex items-center gap-1.5"><i data-lucide="save" class="h-3.5 w-3.5"></i><span>Save Mapping</span></button>
            <a th:href="@{/approval/map}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>

    <!-- New-override row template. Rendered once at page load reflecting the SAME
         matchKeyOptions state as the live rows above — a brand-new row is always
         "known" (blank/unselected), never the unknown-key warning case. -->
    <script type="text/html" id="tpl-override">
        <div data-repeat-row class="row g-3 align-items-stretch mb-2">
            <input type="hidden" name="overrides[__I__].mapId" value=""/>

            <div class="col" th:if="${!matchKeyOptions.isEmpty()}">
              <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center text-center">
                <label class="form-label small fw-semibold">Match Key</label>
                <div class="js-matchkey-select-wrap w-100">
                    <select class="form-select form-select-sm js-matchkey-select" name="overrides[__I__].matchKey">
                        <option value="">— select —</option>
                        <option th:each="opt : ${matchKeyOptions}" th:value="${opt.code}"
                                th:text="${opt.label + ' (' + opt.code + ')'}">Label (CODE)</option>
                        <option value="__CUSTOM__">— custom… —</option>
                    </select>
                </div>
                <div class="js-matchkey-text-wrap d-flex align-items-center justify-content-center gap-1 w-100 d-none">
                    <input type="text" class="form-control form-control-sm js-matchkey-text"
                           name="overrides[__I__].matchKey" disabled placeholder="custom key" maxlength="50"/>
                    <button type="button" class="btn btn-sm btn-outline-secondary js-matchkey-switch" title="Use dropdown instead">
                        <i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i>
                    </button>
                </div>
              </div>
            </div>
            <div class="col" th:if="${matchKeyOptions.isEmpty()}">
              <div class="border rounded-2 p-2 h-100 text-center">
                <label class="form-label small fw-semibold">Match Key</label>
                <input type="text" class="form-control form-control-sm js-matchkey-text"
                       name="overrides[__I__].matchKey" placeholder="match key" maxlength="50" required/>
              </div>
            </div>

            <div class="col">
              <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center text-center">
                <label class="form-label small fw-semibold">Chain</label>
                <select class="form-select form-select-sm select2-step w-100" name="overrides[__I__].chainId">
                    <option value="">— choose chain —</option>
                    <option th:each="c : ${chains}" th:value="${c.chainId}" th:text="${c.chainName}">Chain</option>
                </select>
              </div>
            </div>

            <div class="col-auto flex-shrink-0">
              <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center justify-content-center text-center">
                <label class="form-label small fw-semibold d-block">Active</label>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" value="Y" checked
                           name="overrides[__I__].activeFlag"/>
                </div>
              </div>
            </div>

            <div class="col-auto flex-shrink-0">
              <div class="border rounded-2 p-2 h-100 d-flex flex-column align-items-center justify-content-center text-center">
                <label class="form-label small fw-semibold mb-1">&nbsp;</label>
                <button type="button" class="btn btn-sm btn-outline-danger" data-remove title="Remove override">
                    <i data-lucide="x" class="h-3.5 w-3.5"></i>
                </button>
              </div>
            </div>
        </div>
    </script>

</div>

<th:block layout:fragment="scripts-extra">
<script>
// Both the <select> and the free-text <input> for one override's match key share the
// SAME name attribute; only the enabled one is ever submitted (disabled form controls
// are never sent), which avoids any JS-driven name/attribute renaming.
function setMatchKeyMode($row, mode) {
    var $select = $row.find('.js-matchkey-select').first();
    var $text = $row.find('.js-matchkey-text').first();
    if (!$select.length) {
        return; // free-text-only mode (no matchKeyOptions at all) — nothing to toggle.
    }
    // Use the d-none class (not jQuery .hide()/.show()) — the text wrap carries the
    // d-flex utility class, and Bootstrap's `display:flex !important` silently beats
    // a plain inline `style="display:none"`, leaving the disabled field visible.
    if (mode === 'text') {
        $select.prop('disabled', true).closest('.js-matchkey-select-wrap').addClass('d-none');
        $text.prop('disabled', false).closest('.js-matchkey-text-wrap').removeClass('d-none');
    } else {
        $select.prop('disabled', false).closest('.js-matchkey-select-wrap').removeClass('d-none');
        $text.prop('disabled', true).val('').closest('.js-matchkey-text-wrap').addClass('d-none');
    }
}

$(document).on('change', '.js-matchkey-select', function () {
    var $row = $(this).closest('[data-repeat-row]');
    if ($(this).val() === '__CUSTOM__') {
        setMatchKeyMode($row, 'text');
        $row.find('.js-matchkey-text').val('').focus();
    }
});

$(document).on('click', '.js-matchkey-switch', function (e) {
    e.preventDefault();
    setMatchKeyMode($(this).closest('[data-repeat-row]'), 'select');
});

// Client-side duplicate-matchKey guard — a UX nicety only. The real enforcement is
// server-side (ApprovalFormService.saveMappings) backed by the DB's function-based
// unique index (ux_ses_fam_key).
function findDuplicateMatchKey() {
    var seen = {};
    var dup = null;
    $('#mapForm [data-repeat-row]').each(function () {
        var $row = $(this);
        var $active = $row.find('.js-matchkey-text:enabled, .js-matchkey-select:enabled').first();
        var val = $.trim($active.val() || '');
        if (!val || val === '__CUSTOM__') {
            return;
        }
        if (seen[val]) {
            dup = val;
            return false;
        }
        seen[val] = true;
    });
    return dup;
}

$('#mapForm').on('submit', function (e) {
    var dup = findDuplicateMatchKey();
    if (dup) {
        e.preventDefault();
        Swal.fire({
            title: 'Duplicate match key',
            text: 'The match key "' + dup + '" is used by more than one override. Each override must have a unique match key.',
            icon: 'error'
        });
    }
});

$(document).ready(function () {
    SesRepeat.bind();
    $(document).on('click', '[data-add]', function() {
        setTimeout(function() {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        }, 50);
    });
});
</script>
</th:block>
</body>
</html>
