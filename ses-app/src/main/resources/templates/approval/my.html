<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/base}">

<body>
    <div layout:fragment="content" class="space-y-4">

        <!-- Top Action Bar -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="text-sm font-medium text-slate-500">Antrean Persetujuan:</span>
                <span
                    class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">
                    <strong th:text="${page.totalElements}">0</strong>&nbsp;menunggu tindakan
                </span>
            </div>
        </div>

        <!-- Main Table Card with Embedded Filter Toolbar -->
        <div class="shadcn-card overflow-hidden">
            <!-- Filter Bar Toolbar (Matches Dashboard pattern) -->
            <div class="bg-light border-bottom py-2 px-3">
                <form method="get" th:action="@{/approval}">
                    <div class="d-flex flex-wrap flex-lg-nowrap align-items-center gap-2">
                        <div class="input-group input-group-sm flex-grow-1" style="min-width: 180px;">
                            <span class="input-group-text bg-white border-end-0"><i data-lucide="search" class="h-3.5 w-3.5 text-slate-400"></i></span>
                            <input type="text" name="q" th:value="${param.q}" class="form-control border-start-0"
                                   placeholder="Cari no. transaksi, modul, pemohon, deskripsi..."/>
                        </div>
                        <div style="width: 180px;" class="shrink-0">
                            <select name="module" class="form-select form-select-sm" onchange="this.form.submit()">
                                <option value="" th:selected="${param.module == null or #strings.isEmpty(param.module[0])}">Semua Modul</option>
                                <option value="SES_REQUEST" th:selected="${param.module != null and param.module[0] == 'SES_REQUEST'}">Badge Karyawan</option>
                                <option value="SES_STICKER_REQUEST" th:selected="${param.module != null and param.module[0] == 'SES_STICKER_REQUEST'}">Stiker Kendaraan</option>
                            </select>
                        </div>
                        <div class="shrink-0">
                            <a th:href="@{/approval}" class="btn btn-sm btn-outline-secondary inline-flex items-center gap-1.5 text-nowrap px-3" title="Reset seluruh filter">
                                <i data-lucide="rotate-ccw" class="h-3.5 w-3.5"></i>
                                <span>Reset</span>
                            </a>
                        </div>
                    </div>
                </form>
            </div>
            <div class="p-0">
                <div class="table-responsive">
                    <table id="myTable" class="w-full text-left text-sm">
                        <thead>
                            <tr>
                                <th style="width: 48px;" class="no-sort">#</th>
                                <th>Modul</th>
                                <th>No. Transaksi</th>
                                <th>Deskripsi</th>
                                <th>Pemohon</th>
                                <th>Tanggal Pengajuan</th>
                                <th class="col-actions text-right no-sort" style="width: 110px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r, iter : ${rows}">
                                <td class="text-slate-400 font-medium text-xs" th:text="${iter.count}">1</td>
                                <td>
                                    <span
                                        class="inline-flex items-center px-2 py-0.5 rounded-md text-xs font-medium bg-slate-100 text-slate-700 border border-slate-200"
                                        th:text="${r.module}">New Request</span>
                                </td>
                                <td>
                                    <span
                                        class="inline-flex items-center px-2 py-0.5 rounded-md font-mono text-xs font-semibold bg-blue-50 text-blue-700 border border-blue-200/60"
                                        th:text="${r.transactionId}">REQ-2026-0001</span>
                                </td>
                                <td class="font-medium text-slate-800" th:text="${r.description}">Screening</td>
                                <td class="text-slate-600" th:text="${r.requestorName}">Siti Aminah</td>
                                <td class="text-xs text-slate-500"
                                    th:text="${#dates.format(r.requestDate, 'dd-MM-yyyy HH:mm')}">18-08-2026 10:00</td>
                                <td class="col-actions text-right">
                                    <a th:href="@{/approval/detail/{id}(id=${r.instanceId})}"
                                        class="shadcn-btn shadcn-btn-outline shadcn-btn-sm text-blue-600 hover:bg-blue-50/50 hover:border-blue-200"
                                        title="Review Pengajuan">
                                        <i data-lucide="clipboard-check" class="h-3.5 w-3.5"></i>
                                        <span>Review</span>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div th:replace="~{layout/fragments/pager :: pager(${page})}"></div>
                <div th:if="${page.totalElements == 0 and (param.q == null or #strings.isEmpty(param.q[0]))}"
                    class="flex flex-col items-center justify-center py-12 text-center text-slate-400">
                    <i data-lucide="inbox" class="h-10 w-10 text-slate-300 mb-2"></i>
                    <p class="text-sm font-medium text-slate-600">Tidak ada pengajuan yang menunggu persetujuan</p>
                    <p class="text-xs text-slate-400 mt-0.5">Semua permohonan telah selesai Anda proses.</p>
                </div>
            </div>
        </div>

    </div>

    <th:block layout:fragment="scripts-extra">
        <script th:inline="none">
            document.addEventListener('DOMContentLoaded', function () {
                var tableEl = document.getElementById('myTable');
                if (tableEl && tableEl.querySelectorAll('tbody tr').length > 0) {
                    // serverPaged: the server sends one page and searches the whole
                    // table (layout/fragments/pager.html). Client-side search here
                    // could only filter the rows it was given.
                    new ShadcnTable(tableEl, { serverPaged: true });
                }
            });
        </script>
    </th:block>
</body>

</html>
