<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<body>
<div layout:fragment="content">
    <div class="row"><div class="col-12 col-lg-8">
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/admin/sticker-type/save}" method="post" th:object="${typeForm}">
                <!-- See request-type/form.html: the create/edit flag must round-trip
                     or the duplicate-code guard has nothing to key off. -->
                <input type="hidden" th:field="*{edit}"/>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Kode <span class="text-danger">*</span></label>
                    <input type="text" class="form-control font-monospace"
                           th:field="*{stickerTypeCode}" required maxlength="30"
                           placeholder="mis. REGULER"
                           th:readonly="${!#strings.isEmpty(typeForm.stickerTypeCode)}"
                           th:classappend="${!#strings.isEmpty(typeForm.stickerTypeCode)} ? 'bg-light' : ''"
                           style="text-transform:uppercase;"/>
                    <div class="form-text" th:if="${#strings.isEmpty(typeForm.stickerTypeCode)}">
                        Gunakan huruf kapital dan garis bawah. Tidak dapat diubah setelah dibuat.
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Nama Jenis <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{stickerTypeName}" required maxlength="200"/>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Harga (IDR / Rp) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">Rp</span>
                            <input type="number" class="form-control" th:field="*{price}" min="0" step="1" required/>
                        </div>
                        <div class="form-text">Ditambahkan ke jumlah dasar untuk setiap kendaraan dengan jenis ini.</div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Urutan</label>
                        <input type="number" class="form-control" th:field="*{orderBy}" min="0"/>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Status</label>
                        <select class="form-select" th:field="*{activeFlag}">
                            <option value="Y">Aktif</option>
                            <option value="N">Nonaktif</option>
                        </select>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button th:if="${pageActions['/admin/sticker-type/form'] != null and pageActions['/admin/sticker-type/form'].contains('SUBMIT')}"
                            type="submit" class="btn btn-info text-white"><i data-lucide="save" class="h-4 w-4 inline-block me-1"></i>Simpan</button>
                    <a th:href="@{/admin/sticker-type}" class="btn btn-secondary">Batal</a>
                </div>
            </form>
        </div>
    </div>
    </div></div>
</div>
</body>
</html>
