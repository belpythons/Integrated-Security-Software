<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <footer th:fragment="footer" class="footer fixed-bottom bg-white/95 backdrop-blur-md border-t border-slate-200/80 py-2 text-center text-xs text-slate-500 z-10">
        <div class="container-fluid">
            <!-- Year from the clock. This footer, login.html's and
                 ses-ext/verify.html's all carried a hardcoded "2026" with
                 three different separators; the wording is now one parameter
                 and the year is computed. -->
            <!-- The bullet and the <strong> stay here, in the template: they are
                 presentation, and keeping them out of the stored value means the
                 parameter is plain text (th:text, no markup injection surface)
                 and carries no ';' for a SQL script to trip over. -->
            <span>&copy; <span th:text="${#calendars.year(#calendars.createNow())}">2026</span>
                <strong class="font-semibold text-slate-700"
                        th:text="${appParams != null and appParams['SES_TXT_BRAND_APP_NAME'] != null
                                   ? appParams['SES_TXT_BRAND_APP_NAME'] : 'Security Suite'}">Security Suite</strong>
                &bull;
                <span th:text="${appParams != null and appParams['SES_TXT_BRAND_COMPANY_SHORT'] != null
                                 ? appParams['SES_TXT_BRAND_COMPANY_SHORT'] : 'PT BADAK NGL'}">PT BADAK NGL</span></span>
        </div>
    </footer>
</body>

</html>
