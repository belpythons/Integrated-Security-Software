<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title
        th:text="${pageTitle != null ? pageTitle + ' | ' + (appName ?: 'Security Suite') : (appName ?: 'Security Suite')}">
        MyApps</title>
    <link rel="icon" type="image/png" th:href="@{/image/ptb_logo.png}" />
    <link rel="shortcut icon" th:href="@{/favicon.ico}" />
    <!-- Preload Primary LCP Visual Element (PT Badak LNG Logo) -->
    <link rel="preload" as="image" th:href="@{/image/ptb_logo.png}" fetchpriority="high" type="image/png" />
    <style>
        /* Instant font rendering (prevents FOIT/blocking on LCP text elements) */
        * {
            font-display: swap;
        }
    </style>

    <!-- Core Critical CSS (Render-Blocking) -->
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <link rel="stylesheet" th:href="@{/css/theme.css}" />
    <link rel="stylesheet" th:href="@{/css/tailwind.css}" />

    <!-- Non-Critical Vendor CSS (Asynchronously loaded to unlock First Paint & LCP) -->
    <link rel="stylesheet" th:href="@{/vendor/datatables/css/dataTables.bootstrap5.min.css}" media="print"
        onload="this.media='all'" />
    <link rel="stylesheet" th:href="@{/vendor/datatables/css/responsive.bootstrap5.min.css}" media="print"
        onload="this.media='all'" />
    <link rel="stylesheet" th:href="@{/vendor/flatpickr/flatpickr.min.css}" media="print" onload="this.media='all'" />
    <link rel="stylesheet" th:href="@{/webjars/select2/4.0.13/css/select2.min.css}" media="print"
        onload="this.media='all'" />
    <noscript>
        <link rel="stylesheet" th:href="@{/vendor/datatables/css/dataTables.bootstrap5.min.css}" />
        <link rel="stylesheet" th:href="@{/vendor/datatables/css/responsive.bootstrap5.min.css}" />
        <link rel="stylesheet" th:href="@{/vendor/flatpickr/flatpickr.min.css}" />
        <link rel="stylesheet" th:href="@{/webjars/select2/4.0.13/css/select2.min.css}" />
    </noscript>

    <th:block layout:fragment="head-extra" />
</head>

<body>

    <!-- Sidebar -->
    <th:block th:replace="layout/sidebar :: sidebar" />

    <!-- Navbar -->
    <th:block th:replace="layout/navbar :: navbar" />

    <!-- Page Content -->
    <div id="page-content-wrapper" class="p-4">

        <!-- Page Header -->
        <div class="page-header mb-3">
            <h4 class="text-primary fw-bold" th:text="${pageTitle}">Page Title</h4>
            <hr />
        </div>

        <!-- Flash Messages -->
        <div th:if="${successMsg}"
            class="alert alert-success alert-dismissible fade show animate__animated animate__fadeIn flex items-center"
            role="alert">
            <i data-lucide="check-circle-2" class="h-5 w-5 me-2 inline-block shrink-0 text-emerald-600"></i>
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${errorMsg}"
            class="alert alert-danger alert-dismissible fade show animate__animated animate__fadeIn flex items-center"
            role="alert">
            <i data-lucide="alert-triangle" class="h-5 w-5 me-2 inline-block shrink-0 text-rose-600"></i>
            <span th:text="${errorMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Main Content Area -->
        <div layout:fragment="content">
            <!-- Page-specific content goes here -->
        </div>

    </div><!-- /#page-content-wrapper -->

    <!-- Shared attachment preview modal (see /js/attachment-preview.js) -->
    <div class="modal fade" id="attachmentPreviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title flex items-center gap-1.5"><i data-lucide="paperclip"
                            class="h-4 w-4"></i><span>Attachment Preview</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="attachmentPreviewModalBody"></div>
                <div class="modal-footer">
                    <a id="attachmentPreviewModalDownload" href="#"
                        class="btn btn-outline-primary d-none inline-flex items-center gap-1.5">
                        <i data-lucide="download" class="h-4 w-4"></i><span>Download</span>
                    </a>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <th:block th:replace="layout/footer :: footer" />

    <!-- Scripts -->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/webjars/select2/4.0.13/js/select2.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/modal-reparent.js}"></script>
    <script th:src="@{/vendor/datatables/js/jquery.dataTables.min.js}"></script>
    <script th:src="@{/vendor/datatables/js/dataTables.bootstrap5.min.js}"></script>
    <script th:src="@{/vendor/datatables/js/dataTables.responsive.min.js}"></script>
    <script th:src="@{/vendor/datatables/js/responsive.bootstrap5.min.js}"></script>
    <script th:src="@{/vendor/sweetalert2/sweetalert2.all.min.js}"></script>
    <script th:src="@{/vendor/flatpickr/flatpickr.min.js}"></script>
    <script th:src="@{/vendor/flatpickr/l10n/id.js}"></script>
    <script th:src="@{/js/app.js}"></script>
    <script th:src="@{/js/mobile-nav.js}"></script>
    <script th:src="@{/js/select2-init.js}"></script>
    <script th:src="@{/js/repeat-rows.js}"></script>
    <script th:src="@{/js/attachment-preview.js}"></script>
    <script th:src="@{/js/app-dialog.js}"></script>
    <!-- Self-hosted Lucide Icons & Lightweight Shadcn Table -->
    <script th:src="@{/vendor/lucide/lucide.min.js}"></script>
    <script th:src="@{/js/shadcn-table.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                window.lucide.createIcons();
            }
        });
    </script>

    <th:block layout:fragment="scripts-extra" />

</body>

</html>
