<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
    <nav th:fragment="sidebar" id="sidebar-wrapper" class="bg-navy text-white border-r border-blue-500/20">

        <!-- Logo area (Shadcn Sidebar Brand) -->
        <div class="sidebar-heading text-center py-4 border-b border-blue-500/20">
            <img th:src="@{/image/ptb_logo_reverse_ori.png}" alt="PT Badak NGL" class="mx-auto" width="104" height="87" loading="lazy" decoding="async" style="max-width: 6.5rem; height: auto;" />
        </div>

        <!-- Menu tree -->
        <ul class="list-unstyled ps-0 mt-3 px-2 space-y-1" id="sidebar-nav">
            <th:block th:each="menu : ${sidebarMenus}">

                <!-- Top-level with children (collapsible) -->
                <li th:if="${!menu.children.isEmpty()}" class="mb-1">
                    <a class="flex items-center px-3 py-2 text-slate-200 rounded-lg text-xs font-semibold sidebar-item collapsed transition-colors"
                        data-bs-toggle="collapse" th:href="@{'#menu-' + ${menu.menuId}}"
                        role="button" aria-expanded="false" th:attr="data-menu-title=${menu.menuName}">
                        <i th:attr="data-icon-raw=${menu.menuIcon}" class="sidebar-menu-icon me-2.5 h-4 w-4 shrink-0 inline-block text-slate-400"></i>
                        <span class="truncate" th:text="${menu.menuName}">Group</span>
                        <i data-lucide="chevron-down" class="h-3.5 w-3.5 ms-auto text-slate-400 transition-transform duration-200 sidebar-chevron"></i>
                    </a>
                    <div class="collapse" th:id="'menu-' + ${menu.menuId}" data-bs-parent="#sidebar-nav">
                        <ul class="list-unstyled ps-2 mt-1 space-y-1" th:id="'sidebar-nav-' + ${menu.menuId}">
                            <th:block th:each="child : ${menu.children}">

                                <!-- Second-level with children -->
                                <li th:if="${!child.children.isEmpty()}" class="mb-1">
                                    <a class="flex items-center px-3 py-1.5 text-slate-400 rounded-lg text-xs font-medium sidebar-item-sub collapsed transition-colors"
                                        data-bs-toggle="collapse" th:href="@{'#menu-' + ${child.menuId}}" role="button"
                                        th:attr="data-menu-title=${child.menuName}">
                                        <i th:attr="data-icon-raw=${child.menuIcon}" class="sidebar-sub-icon me-2 h-3.5 w-3.5 shrink-0 inline-block text-slate-400"></i>
                                        <span class="truncate" th:text="${child.menuName}">Sub Group</span>
                                        <i data-lucide="chevron-down" class="h-3 w-3 ms-auto text-slate-500 sidebar-chevron"></i>
                                    </a>
                                    <div class="collapse" th:id="'menu-' + ${child.menuId}"
                                        th:attr="data-bs-parent='#sidebar-nav-' + ${menu.menuId}">
                                        <ul class="list-unstyled ps-2 mt-1 space-y-1">
                                            <li th:each="leaf : ${child.children}" class="mb-1">
                                                <a class="flex items-center px-3 py-1.5 text-slate-400 rounded-lg text-xs font-normal sidebar-leaf transition-colors"
                                                    th:href="@{${leaf.menuUrl}}" th:attr="data-menu-title=${leaf.menuName}">
                                                    <i th:attr="data-icon-raw=${leaf.menuIcon}" class="sidebar-leaf-icon me-2 h-3 w-3 shrink-0 inline-block text-slate-400"></i>
                                                    <span class="truncate" th:text="${leaf.menuName}">Leaf</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </div>
                                </li>

                                <!-- Second-level leaf -->
                                <li th:if="${child.children.isEmpty()}" class="mb-1">
                                    <a class="flex items-center px-3 py-1.5 text-slate-300 rounded-lg text-xs font-normal sidebar-leaf transition-colors"
                                        th:href="@{${child.menuUrl}}" th:attr="data-menu-title=${child.menuName}">
                                        <i th:attr="data-icon-raw=${child.menuIcon}" class="sidebar-leaf-icon me-2 h-3.5 w-3.5 shrink-0 inline-block text-slate-400"></i>
                                        <span class="truncate" th:text="${child.menuName}">Item</span>
                                    </a>
                                </li>

                            </th:block>
                        </ul>
                    </div>
                </li>

                <!-- Top-level leaf (no children) -->
                <li th:if="${menu.children.isEmpty()}" class="mb-1">
                    <a class="flex items-center px-3 py-2 text-slate-200 rounded-lg text-xs font-semibold sidebar-item transition-colors"
                        th:href="@{${menu.menuUrl}}" th:attr="data-menu-title=${menu.menuName}">
                        <i th:attr="data-icon-raw=${menu.menuIcon}" class="sidebar-menu-icon me-2.5 h-4 w-4 shrink-0 inline-block text-slate-400"></i>
                        <span class="truncate" th:text="${menu.menuName}">Item</span>
                    </a>
                </li>

            </th:block>
        </ul>

        <script>
            (function() {
                function toPascalCase(str) {
                    if (!str) return '';
                    return str.split(/[-_ ]+/).map(function(w) {
                        return w.charAt(0).toUpperCase() + w.slice(1);
                    }).join('');
                }

                function isValidLucide(iconName) {
                    if (!iconName || !window.lucide || !window.lucide.icons) return false;
                    var pascal = toPascalCase(iconName);
                    return !!(window.lucide.icons[pascal] || window.lucide[pascal]);
                }

                function resolveLucideIcon(raw, isLeaf, title) {
                    var t = (title || '').toLowerCase().trim();

                    // 1. Direct title matching for high-priority menu items
                    if (t.indexOf('user management') !== -1 || t === 'user management') return 'users';
                    if (t.indexOf('menu management') !== -1 || t === 'menu management') return 'layout-list';
                    if (t.indexOf('role management') !== -1) return 'shield-check';
                    if (t.indexOf('page management') !== -1) return 'file-text';
                    if (t.indexOf('activity log') !== -1 || t.indexOf('activity') !== -1) return 'activity';
                    if (t.indexOf('catalog') !== -1) return 'book-open';
                    if (t.indexOf('error log') !== -1 || t.indexOf('error') !== -1) return 'alert-triangle';
                    if (t.indexOf('scheduler monitor') !== -1 || t.indexOf('scheduler') !== -1) return 'timer';
                    if (t.indexOf('job management') !== -1) return 'history';
                    if (t.indexOf('mail log') !== -1 || t.indexOf('mail') !== -1) return 'mail';
                    if (t.indexOf('parameters') !== -1) return 'sliders';

                    // SES Specific Menus
                    if (t === 'dashboard' || t.indexOf('dashboard') !== -1) return 'layout-dashboard';
                    if (t.indexOf('verifikasi pembayaran') !== -1) return 'badge-check';
                    if (t.indexOf('pengeluaran kas') !== -1) return 'wallet';
                    if (t.indexOf('pemasukan kas') !== -1) return 'trending-up';
                    if (t.indexOf('pembayaran') !== -1 || t.indexOf('payment') !== -1) return 'receipt';
                    if (t.indexOf('request sticker') !== -1 || t.indexOf('pengajuan sticker') !== -1) return 'file-badge';
                    if (t.indexOf('konfigurasi jenis sticker') !== -1) return 'tag';
                    if (t.indexOf('konfigurasi jenis pengajuan') !== -1) return 'list-checks';
                    if (t.indexOf('approval chains') !== -1 || t.indexOf('approval chain') !== -1) return 'workflow';
                    if (t.indexOf('approval form mapping') !== -1 || t.indexOf('approval map') !== -1) return 'route';
                    if (t.indexOf('tanda pengenal pekerja') !== -1) return 'id-card';
                    if (t.indexOf('badge karyawan') !== -1) return 'file-plus';
                    if (t.indexOf('sticker') !== -1) return 'car-front';
                    if (t.indexOf('ses (admin)') !== -1) return 'shield';
                    if (t.indexOf('ses form configuration') !== -1) return 'settings';
                    if (t.indexOf('administration') !== -1) return 'settings';
                    if (t.indexOf('jadwal') !== -1 || t.indexOf('calendar') !== -1) return 'calendar';
                    if (t.indexOf('riwayat') !== -1 || t.indexOf('history') !== -1) return 'history';

                    if (!raw) return isLeaf ? 'chevron-right' : 'folder';

                    // 2. Direct Lucide icon name check (clean bi- / bi bi-)
                    var cleanRaw = raw.replace(/^bi\s+bi-|^bi-/, '').trim().toLowerCase();
                    if (isValidLucide(cleanRaw)) {
                        return cleanRaw;
                    }

                    // 3. Normalized keyword checks with bug fixes
                    var s = raw.toLowerCase();
                    if (s.indexOf('dashboard') !== -1 || s.indexOf('grid-1x2') !== -1 || s.indexOf('speedometer') !== -1) return 'layout-dashboard';
                    if (s.indexOf('workflow') !== -1 || s.indexOf('diagram-3') !== -1 || s.indexOf('chain') !== -1) return 'workflow';
                    if (s.indexOf('signpost') !== -1 || s.indexOf('route') !== -1) return 'route';
                    if (s.indexOf('badge-check') !== -1) return 'badge-check';
                    if (s.indexOf('file-badge') !== -1) return 'file-badge';
                    if (s.indexOf('id-card') !== -1 || s.indexOf('clipboard-check') !== -1) return 'id-card';
                    if (s.indexOf('wallet') !== -1) return 'wallet';
                    if (s.indexOf('credit-card') !== -1 || s.indexOf('cash-coin') !== -1 || s.indexOf('receipt') !== -1) return 'receipt';
                    if (s.indexOf('cash') !== -1 || s.indexOf('coin') !== -1 || s.indexOf('pay') !== -1) return 'credit-card';
                    if (s.indexOf('tag') !== -1) return 'tag';
                    if (s.indexOf('graph-up') !== -1) return 'trending-up';
                    // Note: check credit-card/cash BEFORE car to prevent "credit-card" from matching "car"
                    if (s.indexOf('car') !== -1 || s.indexOf('vehicle') !== -1) return 'car-front';
                    if (s.indexOf('calendar') !== -1 || s.indexOf('schedule') !== -1) return 'calendar';
                    if (s.indexOf('clock') !== -1 || s.indexOf('history') !== -1) return 'history';
                    if (s.indexOf('graph') !== -1 || s.indexOf('chart') !== -1) return 'layout-dashboard';
                    if (s.indexOf('bar-graph') !== -1) return 'bar-chart-3';
                    if (s.indexOf('list-check') !== -1 || s.indexOf('queue') !== -1) return 'list-checks';
                    if (s.indexOf('gear') !== -1 || s.indexOf('setting') !== -1) return 'settings';
                    if (s.indexOf('slider') !== -1 || s.indexOf('param') !== -1) return 'sliders';
                    if (s.indexOf('earmark-plus') !== -1 || s.indexOf('file-plus') !== -1) return 'file-plus';
                    if (s.indexOf('file') !== -1 || s.indexOf('doc') !== -1) return 'file-text';
                    if (s.indexOf('people') !== -1 || s.indexOf('users') !== -1 || s.indexOf('user-management') !== -1 || s.indexOf('user') !== -1 || s.indexOf('person') !== -1) return 'users';
                    if (s.indexOf('shield-check') !== -1) return 'shield-check';
                    if (s.indexOf('shield-lock') !== -1 || s.indexOf('shield') !== -1) return 'shield';
                    if (s.indexOf('check-square') !== -1) return 'check-square';
                    if (s.indexOf('circle') !== -1) return 'circle';
                    if (s.indexOf('folder2') !== -1) return 'folder-open';
                    if (s.indexOf('folder') !== -1) return 'folder';
                    if (s.indexOf('chevron-right') !== -1) return 'chevron-right';

                    return isLeaf ? 'chevron-right' : 'folder';
                }

                function initSidebarLucideIcons() {
                    var items = document.querySelectorAll('#sidebar-wrapper i[data-icon-raw]');
                    items.forEach(function(el) {
                        var raw = el.getAttribute('data-icon-raw');
                        var isLeaf = el.classList.contains('sidebar-leaf-icon');
                        var parentLink = el.closest('a');
                        var title = (parentLink && (parentLink.getAttribute('data-menu-title') || parentLink.textContent)) || '';
                        var name = resolveLucideIcon(raw, isLeaf, title);
                        el.setAttribute('data-lucide', name);
                    });
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons();
                    }
                }

                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', initSidebarLucideIcons);
                } else {
                    initSidebarLucideIcons();
                }
            })();
        </script>
    </nav>
</body>

</html>
