spring.application.name=ses-ext

# Loads deployment-local properties file if present
spring.profiles.active=local

# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT_EXT:${SERVER_PORT:8083}}
server.servlet.context-path=/ses-ext

# ─── DataSource ───────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:10.10.214.48}:${DB_PORT:1521}/${DB_SERVICE:${DB_SID:ELLDEV}}
spring.datasource.username=${DB_USERNAME:ses}
spring.datasource.password=${DB_PASSWORD:ses2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=15
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.data-source-properties.defaultRowPrefetch=50

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=30

# ─── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8
spring.devtools.add-properties=false
spring.devtools.livereload.enabled=false

# cache=true above is required in anything that is not a template-editing
# session. With it false, base + sidebar + navbar + footer + the page template
# are re-parsed on EVERY request. Measured on this schema: /sticker renders in
# ~420 ms while issuing only 5 queries (~25 ms of DB at this RTT), and /history
# in ~1250 ms on 10 queries -- the gap is template parsing, paid on every page.
# Override to false in application-local.properties while editing templates;
# never ship it false.

# --- Static resources: caching + content-hash versioning ---------------------
# Before this block the app sent no Cache-Control at all on /css, /js, /vendor,
# /image (and `no-store` whenever devtools was active), so every navigation
# re-downloaded ~2.8 MB of unchanged assets. That, not the DB, is the bulk of
# the "every page takes 5 seconds" report.
#
# max-age is safe this high ONLY because of the content chain below: it rewrites
# every th:href/th:src="@{...}" link to carry a hash of the file's bytes, so
# changing a file changes its URL and no client can serve a stale copy. Spring
# Boot registers ResourceUrlEncodingFilter automatically when the chain is
# enabled, which is what makes Thymeleaf's @{...} emit the hashed form.
# Do not set max-age without the chain.
spring.web.resources.cache.cachecontrol.max-age=365d
# 365d cache for static resources
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.chain.compressed=true
spring.web.resources.chain.cache=true

# --- Mail: queue here, send from ses-app -------------------------------------
# This WAR shares ses-app's Oracle schema. It must be able to QUEUE mail (a
# finished contractor upload triggers the approval chain, which notifies the
# first approver) but must never SEND: two JVMs draining one unlocked APP_MAIL
# with findPending -> send -> markSent is a double-send race, and only
# ses-app's drain is cron-driven and TESTING_MODE-aware.
#
# Excluding com.badaklng.ses.mail from SesExtApplication's component scan is
# not an option -- SesMailDispatcherService is a required constructor
# dependency of ApprovalMailService and RequestMailService, both of which this
# module genuinely uses. Hence a runtime flag.
ses.mail.dispatch.enabled=false

# --- Response compression ----------------------------------------------------
# WARNING: server.* configures the EMBEDDED container only. On WebLogic 12c this
# whole block is ignored -- GZIP has to be switched on per Managed Server
# (Console -> Server -> Protocols -> HTTP -> Enable GZIP Compression); see
# docs/build-production.md. Keep both: this covers `java -jar` and local runs.
# Measured ratio on this asset set: 2 757 328 B -> 732 293 B (26.6%).
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/css,text/plain,text/javascript,application/javascript,application/json,application/xml,image/svg+xml

# ─── Uploads (AppFileService, com.badaklng.ses.file) ───────────────────────────
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.file-size-threshold=1MB
server.tomcat.max-http-form-post-size=-1
server.tomcat.max-swallow-size=-1
ses.upload.max-document-size=20MB
ses.upload.allowed-types=application/pdf,image/jpeg,image/png

# ─── Quartz (Disabled in DMZ Gateway) ──────────────────────────────────────────
spring.quartz.job-store-type=memory
app.scheduler.auto-start=true

# ─── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.health.ldap.enabled=false

# ─── LDAP (Disabled in DMZ Gateway) ───────────────────────────────────────────
app.ldap.enabled=false

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.badaklng=INFO
